services:
  - type: web
    name: strategy-3-smc-liquidity-sweep
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OANDA_ENV
        value: practice
      - key: PORT
        value: 5002
      - key: VIRTUAL_CAPITAL
        value: "2000.0"
      - key: TARGET_PROFIT_PCT
        value: "8.0"
      - key: MAX_DRAWDOWN_PCT
        value: "8.0"
      - key: MAX_DAILY_LOSS_PCT
        value: "5.0"
      - key: RISK_PER_TRADE_PCT
        value: "1.25"
      - key: RISK_REWARD_RATIO
        value: "1.5"
      - key: INSTRUMENTS
        value: "EUR_USD,GBP_USD,XAU_USD"
      - key: TIMEFRAME
        value: "M15"
